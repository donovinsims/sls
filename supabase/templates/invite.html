<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You’re invited - SLS Trading Course</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f3ec;font-family:Arial,Helvetica,sans-serif;color:#1f1a17;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f6f3ec;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;background:#ffffff;border:1px solid #e7dfd4;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:32px 28px 8px 28px;background:linear-gradient(180deg,#1d1713 0%,#2b211b 100%);color:#f7f2eb;">
                <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d8bf8b;font-weight:700;">SLS Trading Course</div>
                <h1 style="margin:12px 0 0 0;font-size:28px;line-height:1.2;font-weight:700;">You have been invited</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 16px 0;font-size:16px;line-height:1.7;color:#3b342e;">
                  An account was created for <strong>{{ .Email }}</strong>. Finish setup by opening your invite link.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;">
                  <tr>
                    <td style="border-radius:10px;background:#c8a962;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">
                        Accept Invite
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#8a7d6e;word-break:break-all;">
                  {{ .ConfirmationURL }}
                </p>
                <p style="margin:24px 0 0 0;font-size:14px;line-height:1.7;color:#5d544c;">
                  If you were not expecting this invite, you can safely ignore this email.
                </p>
                <p style="margin:14px 0 0 0;font-size:14px;line-height:1.7;color:#5d544c;">
                  Support: <a href="mailto:donovinsims@gmail.com" style="color:#a8843e;text-decoration:none;">donovinsims@gmail.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
